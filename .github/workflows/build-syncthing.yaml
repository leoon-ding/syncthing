name: Build Syncthing

# This fork supplies pinned source to libscm; it does not publish releases.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Match the downstream Go minor version. Regression tests use synctest.Test,
  # which requires Go 1.25; go.mod still declares the source build minimum.
  GO_VERSION: "~1.25.0"
  LOGGER_DISCARD: "1"
  GOTOOLCHAIN: local

jobs:
  build-test:
    name: Build and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Set git to use LF
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Generate default assets
        run: go run build.go assets
      - name: Build all packages
        run: go build ./...
      # Keep the upstream test runner's package selection, timeout and race
      # policy, but report directly to Actions without upstream Loki access.
      - name: Test
        run: go run build.go test
        env:
          CGO_ENABLED: "1"
      - name: Vet
        if: runner.os == 'Linux'
        run: go vet ./...

  static:
    name: Static and meta checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Generate default assets
        run: go run build.go assets
      - name: Meta checks
        run: go test -v ./meta
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          only-new-issues: true

  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Generate default assets
        run: go run build.go assets
      - name: Scan vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  basics:
    # Preserve the existing check name for repository merge rules.
    name: Basic checks passed
    if: always()
    needs: [build-test, static, govulncheck]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
